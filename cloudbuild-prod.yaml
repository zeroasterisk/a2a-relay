steps:
  # Build Go binary
  - name: 'golang:1.22'
    dir: 'relay-go'
    entrypoint: 'go'
    args: ['build', '-o', 'relay', '.']

  # Build Docker image (tagged with the git tag + immutable commit sha)
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'relay-go'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/a2a-relay:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/a2a-relay:prod'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/a2a-relay'

  # Deploy to Cloud Run (production). min-instances=1 to avoid cold starts.
  # JWT secret mounted at runtime from Secret Manager (a2a-relay-jwt-secret).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'a2a-relay'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/a2a-relay:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--set-secrets'
      - 'RELAY_JWT_SECRET=a2a-relay-jwt-secret:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 600s
